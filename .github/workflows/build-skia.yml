```yaml
name: Build Skia
run-name: Build Skia

on:
  workflow_dispatch:
    inputs:
      skia_branch:
        description: 'Skia branch to build (e.g., chrome/m144)'
        required: false
        type: string
        default: 'chrome/m149'

      platforms:
        description: 'Platforms to build (comma-separated, or "all")'
        required: false
        type: string
        default: 'all'

      test_mode:
        description: 'Run in test mode (skip Skia build)'
        required: false
        type: boolean
        default: false

      skip_release:
        description: 'Skip creating release'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.skia_branch || 'chrome/m144' }}-${{ inputs.platforms || 'all' }}-${{ inputs.skip_release && 'skip-release' || 'release' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Build every platform independently.
  #
  # fail-fast: false means one failed matrix entry does NOT cancel the others.
  # ---------------------------------------------------------------------------
  build-skia:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            variant: gpu
            arch: "universal"

          - os: macos-15
            platform: mac
            variant: gpu
            arch: "arm64"

          - os: macos-15
            platform: mac
            variant: gpu
            arch: "x86_64"

          - os: macos-15
            platform: ios
            variant: gpu
            arch: "arm64"
            target: "device"

          - os: macos-15
            platform: ios
            variant: gpu
            arch: "arm64,x86_64"
            target: "simulator"

          - os: macos-15
            platform: visionos
            variant: gpu
            arch: "arm64"
            target: "device"

          - os: macos-15
            platform: visionos
            variant: gpu
            arch: "arm64"
            target: "simulator"

          - os: windows-2022
            platform: win
            variant: gpu
            arch: x64
            config: Release

          - os: windows-2022
            platform: win
            variant: gpu
            arch: x64
            config: Debug

          - os: windows-2022
            platform: win
            variant: gpu
            arch: x64
            config: Release
            crt: MD

          - os: windows-2022
            platform: win
            variant: gpu
            arch: x64
            config: Debug
            crt: MD

          - os: ubuntu-latest
            platform: linux
            variant: gpu
            arch: x64

          - os: ubuntu-latest
            platform: wasm
            variant: gpu
            arch: "wasm32"
            config: Release

    runs-on: ${{ matrix.os }}

    env:
      SKIA_BRANCH: ${{ inputs.skia_branch || 'chrome/m144' }}

    steps:
      - name: Check if platform should build
        id: check
        shell: bash
        run: |
          PLATFORMS="${{ inputs.platforms || 'all' }}"

          if [[ "$PLATFORMS" == "all" ]] || [[ ",$PLATFORMS," == *",${{ matrix.platform }},"* ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.platform }} (not in platforms: $PLATFORMS)"
          fi

      - name: Checkout repository
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@v6

      - name: Free disk space (Linux)
        if: steps.check.outputs.should_build == 'true' && runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Install Linux build dependencies
        if: steps.check.outputs.should_build == 'true' && matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-xkb-dev \
            libwayland-dev

      - name: Install Ninja
        if: steps.check.outputs.should_build == 'true'
        shell: bash
        run: |
          if command -v ninja >/dev/null 2>&1; then
            ninja --version
            exit 0
          fi

          case "${{ runner.os }}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y ninja-build
              ;;
            macOS)
              brew install ninja
              ;;
            Windows)
              choco install ninja --no-progress --yes
              printf '%s\n' 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"
              export PATH="/c/ProgramData/chocolatey/bin:$PATH"
              ;;
          esac

          ninja --version

      - name: Set up Python
        if: steps.check.outputs.should_build == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set Git default branch
        if: steps.check.outputs.should_build == 'true'
        run: git config --global init.defaultBranch main

      - name: Install LLVM and Clang
        if: steps.check.outputs.should_build == 'true' && runner.os != 'macOS' && matrix.os != 'windows-11-arm'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1.0"
          env: true

      - name: Set cache key arch
        if: steps.check.outputs.should_build == 'true'
        id: cache-key
        shell: bash
        run: |
          ARCH_SAFE=$(echo "${{ matrix.arch || 'default' }}" | tr ',' '-')
          echo "arch=${ARCH_SAFE}" >> "$GITHUB_OUTPUT"

      - name: Cache depot_tools and Skia source
        if: steps.check.outputs.should_build == 'true'
        uses: actions/cache@v5
        with:
          path: |
            build/tmp/depot_tools
            build/src/skia
          key: ${{ runner.os }}-${{ steps.cache-key.outputs.arch }}-depot_tools-skia-${{ env.SKIA_BRANCH }}-${{ hashFiles('build-skia.py') }}

      - name: Build Skia (${{ matrix.config || 'Release' }})
        if: steps.check.outputs.should_build == 'true' && !inputs.test_mode
        shell: bash
        run: |
          ARCH_ARG=""
          if [ -n "${{ matrix.arch }}" ]; then
            ARCH_ARG="-archs ${{ matrix.arch }}"
          fi

          TARGET_ARG=""
          if [ -n "${{ matrix.target }}" ]; then
            TARGET_ARG="-target ${{ matrix.target }}"
          fi

          CRT_ARG=""
          if [ -n "${{ matrix.crt }}" ]; then
            CRT_ARG="-crt ${{ matrix.crt }}"
          fi

          CONFIG="${{ matrix.config || 'Release' }}"

          python3 build-skia.py \
            ${{ matrix.platform }} \
            -variant ${{ matrix.variant }} \
            -config "$CONFIG" \
            --shallow \
            -branch "${{ env.SKIA_BRANCH }}" \
            $ARCH_ARG \
            $TARGET_ARG \
            $CRT_ARG

      - name: Set archive name
        if: steps.check.outputs.should_build == 'true'
        id: archive
        shell: bash
        run: |
          CONFIG="${{ matrix.config || 'Release' }}"
          CONFIG_LOWER=$(echo "$CONFIG" | tr '[:upper:]' '[:lower:]')

          NAME="skia-build-${{ matrix.platform }}"

          if [ -n "${{ matrix.target }}" ]; then
            NAME="${NAME}-${{ matrix.target }}"
          fi

          if [ -n "${{ matrix.arch }}" ]; then
            ARCH_SAFE=$(echo "${{ matrix.arch }}" | tr ',' '-')
            NAME="${NAME}-${ARCH_SAFE}"
          fi

          VARIANT_SUFFIX="${{ matrix.variant }}"

          if [ "${{ matrix.crt }}" = "MD" ]; then
            VARIANT_SUFFIX="${VARIANT_SUFFIX}-md"
          fi

          NAME="${NAME}-${VARIANT_SUFFIX}-${CONFIG_LOWER}"

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "libdir=build/${{ matrix.platform }}-${VARIANT_SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Create dummy files for test mode
        if: steps.check.outputs.should_build == 'true' && inputs.test_mode
        shell: bash
        run: |
          mkdir -p build/include
          mkdir -p "${{ steps.archive.outputs.libdir }}"

          echo "Test file" > build/include/test.h
          echo "Test lib" > "${{ steps.archive.outputs.libdir }}/test.lib"
          echo "GN args summary" > "${{ steps.archive.outputs.libdir }}/gn_args.txt"

      - name: Package binaries
        if: steps.check.outputs.should_build == 'true'
        shell: bash
        run: |
          SHARE_DIR=""

          if [ -d "build/share" ]; then
            SHARE_DIR="build/share"
          fi

          if [ "${{ runner.os }}" == "Windows" ]; then
            7z a -tzip \
              "${{ steps.archive.outputs.name }}.zip" \
              build/include \
              $SHARE_DIR \
              "${{ steps.archive.outputs.libdir }}"
          else
            zip -r \
              "${{ steps.archive.outputs.name }}.zip" \
              build/include \
              $SHARE_DIR \
              "${{ steps.archive.outputs.libdir }}"
          fi

      - name: Upload artifact
        if: steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.name }}.zip


  # ---------------------------------------------------------------------------
  # Create whatever XCFramework slices are actually available.
  #
  # IMPORTANT:
  #   always() means a failed Windows/Linux/etc. matrix entry does not prevent
  #   this job from running.
  # ---------------------------------------------------------------------------
  create-xcframework:
    needs: build-skia
    if: ${{ always() && !inputs.skip_release }}
    runs-on: macos-15

    steps:
      - name: Download available Apple artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: |
            skia-build-mac-universal-gpu-release
            skia-build-ios-device-arm64-gpu-release
            skia-build-ios-simulator-arm64-x86_64-gpu-release
            skia-build-visionos-device-arm64-gpu-release
            skia-build-visionos-simulator-arm64-gpu-release
          merge-multiple: true
          path: downloaded-artifacts
          if-no-files-found: ignore

      - name: Extract available artifacts
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          shopt -s nullglob

          zips=(downloaded-artifacts/*.zip)

          if [ ${#zips[@]} -eq 0 ]; then
            echo "No Apple artifacts were built."
            echo "has_xcframework=false" >> "$GITHUB_ENV"
            exit 0
          fi

          for zip in "${zips[@]}"; do
            echo "Extracting $zip..."
            unzip -o "$zip" -d extracted
          done

          echo "Available libraries:"
          find extracted/build -name "libSkia.a" -print || true

      - name: Strip arm64e from libraries
        shell: bash
        run: |
          set -e

          if [ ! -d extracted/build ]; then
            exit 0
          fi

          strip_arm64e() {
            local lib="$1"

            if lipo -info "$lib" 2>/dev/null | grep -q "arm64e"; then
              echo "Stripping arm64e from $lib"

              lipo "$lib" \
                -remove arm64e \
                -output "${lib}.tmp"

              mv "${lib}.tmp" "$lib"
            fi
          }

          find extracted/build \
            -name "libSkia.a" \
            -print0 |
          while IFS= read -r -d '' lib; do
            strip_arm64e "$lib"
          done

      - name: Create partial XCFramework
        id: xcframework
        shell: bash
        run: |
          set -e

          BUILD="extracted/build"
          OUTPUT="Skia.xcframework"

          rm -rf "$OUTPUT"

          IOS_DEVICE="$BUILD/ios-gpu/lib/Release/device-arm64/libSkia.a"
          IOS_SIM_ARM64="$BUILD/ios-gpu/lib/Release/simulator-arm64/libSkia.a"
          IOS_SIM_X86="$BUILD/ios-gpu/lib/Release/simulator-x86_64/libSkia.a"

          MAC="$BUILD/mac-gpu/lib/Release/libSkia.a"

          VISION_DEVICE="$BUILD/visionos-gpu/lib/Release/device-arm64/libSkia.a"
          VISION_SIM="$BUILD/visionos-gpu/lib/Release/simulator-arm64/libSkia.a"

          HEADERS="$BUILD/include"

          LIB_ARGS=()

          # -------------------------------------------------------------------
          # macOS
          # -------------------------------------------------------------------
          if [ -f "$MAC" ]; then
            echo "Including macOS"
            LIB_ARGS+=(
              -library "$MAC"
              -headers "$HEADERS"
            )
          fi

          # -------------------------------------------------------------------
          # iOS device
          # -------------------------------------------------------------------
          if [ -f "$IOS_DEVICE" ]; then
            echo "Including iOS device"
            LIB_ARGS+=(
              -library "$IOS_DEVICE"
            )
          fi

          # -------------------------------------------------------------------
          # iOS simulator
          #
          # Merge whichever simulator architectures actually exist.
          # -------------------------------------------------------------------
          IOS_SIM=""

          if [ -f "$IOS_SIM_ARM64" ] && [ -f "$IOS_SIM_X86" ]; then
            echo "Merging iOS simulator arm64 + x86_64"

            mkdir -p "$BUILD/ios-gpu/lib/Release/simulator"

            IOS_SIM="$BUILD/ios-gpu/lib/Release/simulator/libSkia.a"

            lipo -create \
              "$IOS_SIM_ARM64" \
              "$IOS_SIM_X86" \
              -output "$IOS_SIM"

          elif [ -f "$IOS_SIM_ARM64" ]; then
            echo "Using iOS simulator arm64"

            IOS_SIM="$IOS_SIM_ARM64"

          elif [ -f "$IOS_SIM_X86" ]; then
            echo "Using iOS simulator x86_64"

            IOS_SIM="$IOS_SIM_X86"
          fi

          if [ -n "$IOS_SIM" ]; then
            echo "Including iOS simulator"
            LIB_ARGS+=(
              -library "$IOS_SIM"
            )
          fi

          # -------------------------------------------------------------------
          # visionOS device
          # -------------------------------------------------------------------
          if [ -f "$VISION_DEVICE" ]; then
            echo "Including visionOS device"
            LIB_ARGS+=(
              -library "$VISION_DEVICE"
            )
          fi

          # -------------------------------------------------------------------
          # visionOS simulator
          # -------------------------------------------------------------------
          if [ -f "$VISION_SIM" ]; then
            echo "Including visionOS simulator"
            LIB_ARGS+=(
              -library "$VISION_SIM"
            )
          fi

          # Count libraries.
          LIB_COUNT=0

          for arg in "${LIB_ARGS[@]}"; do
            if [ "$arg" = "-library" ]; then
              LIB_COUNT=$((LIB_COUNT + 1))
            fi
          done

          if [ "$LIB_COUNT" -eq 0 ]; then
            echo "No Apple libraries were successfully built."
            echo "has_xcframework=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Creating XCFramework with $LIB_COUNT library slices..."

          xcodebuild -create-xcframework \
            "${LIB_ARGS[@]}" \
            -output "$OUTPUT"

          # -------------------------------------------------------------------
          # Put headers at the XCFramework root and symlink them from each
          # platform directory.
          # -------------------------------------------------------------------
          if [ -d "$HEADERS" ]; then
            HEADERS_SRC=$(find "$OUTPUT" -type d -name "Headers" | head -1 || true)

            if [ -n "$HEADERS_SRC" ]; then
              rm -rf "$OUTPUT/Headers"
              mv "$HEADERS_SRC" "$OUTPUT/Headers"

              ln -s ../Headers "$HEADERS_SRC"

              for dir in "$OUTPUT"/*/; do
                dir=${dir%/}

                if [ -d "$dir" ] &&
                   [ ! -L "$dir/Headers" ] &&
                   [ ! -d "$dir/Headers" ]; then
                  ln -s ../Headers "$dir/Headers"
                fi
              done
            fi
          fi

          echo "XCFramework structure:"
          find "$OUTPUT" -maxdepth 3 -print

          echo "has_xcframework=true" >> "$GITHUB_OUTPUT"

      - name: Package XCFramework
        if: steps.xcframework.outputs.has_xcframework == 'true'
        run: |
          zip -ry Skia.xcframework.zip Skia.xcframework

      - name: Upload XCFramework artifact
        if: steps.xcframework.outputs.has_xcframework == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Skia.xcframework
          path: Skia.xcframework.zip


  # ---------------------------------------------------------------------------
  # Release EVERYTHING that succeeded.
  #
  # This intentionally does NOT require build-skia or create-xcframework to
  # succeed. Successful matrix artifacts are still released when some builds
  # fail.
  # ---------------------------------------------------------------------------
  create-release:
    needs:
      - build-skia
      - create-xcframework

    if: ${{ always() && !inputs.skip_release }}

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all successful artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          if-no-files-found: ignore

      - name: List artifacts
        shell: bash
        run: |
          echo "Artifacts that will be released:"
          find release-artifacts -type f -print || true

      - name: Prepare release files
        shell: bash
        run: |
          set -e

          mkdir -p release-files

          find release-artifacts \
            -type f \
            -name "*.zip" \
            -exec cp {} release-files/ \;

          echo "Release files:"
          find release-files -type f -print

      - name: Create/update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.skia_branch || 'chrome/m144' }}${{ inputs.test_mode && '-test' || '' }}
          name: ${{ inputs.skia_branch || 'chrome/m144' }}${{ inputs.test_mode && ' (Test)' || '' }}
          draft: false
          prerelease: ${{ inputs.test_mode }}
          files: |
            release-files/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
